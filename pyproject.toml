[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ffp-sat"
version = "0.1.0"
description = "Verified incremental SAT solver for the Firefighter Problem"
requires-python = ">=3.10"
dependencies = ["python-sat", "networkx"]

[project.scripts]
ffp-sat = "ffp_sat.cli:main"

[tool.setuptools.packages.find]
include = ["ffp_sat*"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
